---
# tasks file for proxmox-setup
- name: IPv6 aktivieren
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: 0
    sysctl_set: true
    state: present
    reload: true
  loop:
    - net.ipv6.conf.all.disable_ipv6

# Die Community-Scripts werden auf einen festen Commit gepinnt statt auf den
# beweglichen main-Branch: so ist reproduzierbar, welcher Code als root laufen
# wird, und ein kompromittiertes Upstream-Repo landet nicht automatisch hier.
# Zum Aktualisieren den Commit-Hash bewusst anheben (Stand: 2026-07-16).
- name: Lade das Home Assistant OS Script herunter
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/community-scripts/ProxmoxVE/b9f26d66ed5131bcded155ebb83784f303cf4355/vm/haos-vm.sh
    dest: /root/ha-install.sh
    mode: "0755"

- name: Lade das post-pve-install.sh Script herunter
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/community-scripts/ProxmoxVE/b9f26d66ed5131bcded155ebb83784f303cf4355/tools/pve/post-pve-install.sh
    dest: /root/post-pve-install.sh
    mode: "0755"

# Governor/EPP über eine systemd-Unit setzen, damit die Einstellung Reboots
# und Kernel-Updates übersteht (Proxmox setzt sonst wieder "performance").
- name: Systemd-Unit für CPU-Governor anlegen
  ansible.builtin.copy:
    dest: /etc/systemd/system/cpu-governor.service
    mode: "0644"
    content: |
      [Unit]
      Description=CPU-Governor ({{ proxmox_cpu_governor }}) und EPP ({{ proxmox_cpu_epp }}) setzen
      After=sysinit.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/sh -c 'for c in /sys/devices/system/cpu/cpu[0-9]*/cpufreq; do echo {{ proxmox_cpu_governor }} > "$c/scaling_governor"; [ -w "$c/energy_performance_preference" ] && echo {{ proxmox_cpu_epp }} > "$c/energy_performance_preference"; done; true'

      [Install]
      WantedBy=multi-user.target
  register: cpu_governor_unit

- name: CPU-Governor-Unit aktivieren und anwenden
  ansible.builtin.systemd_service:
    name: cpu-governor.service
    enabled: true
    state: "{{ cpu_governor_unit.changed | ternary('restarted', 'started') }}"
    daemon_reload: "{{ cpu_governor_unit.changed }}"
