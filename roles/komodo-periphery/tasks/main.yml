---
# tasks file for komodo-periphery
# Installiert und konfiguriert den Komodo Periphery Agent als systemd-Dienst
# (statt im Container) – analog zur pangolin-newt-Rolle.

- name: Servernamen (connect_as) ermitteln
  ansible.builtin.import_tasks: connect_as.yml
  when: install_periphery | default(false)

- name: Onboarding via Komodo API (nur Erstinstall)
  ansible.builtin.import_tasks: komodo_api.yml
  when: install_periphery | default(false)

- name: Komodo-Verzeichnisse anlegen
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/komodo
    - "{{ periphery_root_directory }}"
    - "{{ periphery_root_directory }}/keys"
  when: install_periphery | default(false)

- name: Update-/Installations-Skript für Periphery kopieren
  ansible.builtin.template:
    src: periphery_update.j2
    dest: /etc/cron.daily/periphery_update
    owner: root
    group: root
    mode: "0755"
  when: install_periphery | default(false)

- name: Initialer Download der Periphery-Binary
  ansible.builtin.command: /etc/cron.daily/periphery_update
  args:
    creates: "{{ periphery_bin }}"
  when: install_periphery | default(false)

- name: Periphery-Konfiguration erzeugen
  ansible.builtin.template:
    src: periphery.config.toml.j2
    dest: "{{ periphery_config_path }}"
    owner: root
    group: root
    mode: "0600"
  notify:
    - Enable and start periphery
  when: install_periphery | default(false)

- name: "ACHTUNG: Server in Komodo umbenennen"
  # Periphery meldet sich ab dem Neustart unter dem neuen Namen an. Core ordnet
  # die Verbindung nur über den Namen zu und meldet einen unbekannten Namen
  # nicht als Fehler – der Server bleibt stumm "unhealthy", bis er in Komodo
  # umbenannt ist. Das Keypair bleibt gültig, ein neues Onboarding ist unnötig.
  ansible.builtin.debug:
    msg:
      - "connect_as geändert: '{{ periphery_previous_connect_as }}' -> '{{ periphery_effective_connect_as }}'"
      - "In Komodo den Server '{{ periphery_previous_connect_as }}' in '{{ periphery_effective_connect_as }}' umbenennen,"
      - "sonst bleibt er unhealthy (Core meldet den unbekannten Namen nicht als Fehler)."
  changed_when: true
  when:
    - install_periphery | default(false)
    - periphery_previous_connect_as | length > 0
    - periphery_previous_connect_as != periphery_effective_connect_as

- name: Periphery Systemd Service erzeugen
  ansible.builtin.template:
    src: periphery.service.j2
    dest: /etc/systemd/system/periphery.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Enable and start periphery
  when: install_periphery | default(false)
